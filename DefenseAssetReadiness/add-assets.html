
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARS | Add New Asset</title>

    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body class="dashboard-body">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-logo">DARS</div>

        <p class="sidebar-subtitle">ASSET MANAGEMENT</p>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="assets.html">Assets</a>
            <a href="add-assets.html" class="active">Add New Asset</a>
            <a href="maintenance.html">Maintenance</a>
            <a href="login.html">Logout</a>
        </nav>

    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">

        <header class="dashboard-header">

            <div>
                <h1>Add New Asset</h1>
                <p>Register a new defense asset in the system.</p>
            </div>

            <div class="admin-label">ADMINISTRATOR</div>

        </header>

        <!-- Asset Form -->
        <section class="recent-section">

            <h2>Asset Registration Form</h2>

            <form id="assetForm" action="add-asset" method="POST">

                <div style="margin:20px 0;">

                    <label>Asset Code</label>
                    <input type="text"
                           name="asset_code"
                           placeholder="Example: DARS001"
                           required
                           style="display:block;width:100%;padding:12px;margin:8px 0 20px;">

                    <label>Asset Name</label>
                    <input type="text"
                           name="asset_name"
                           placeholder="Enter asset name"
                           required
                           style="display:block;width:100%;padding:12px;margin:8px 0 20px;">

                    <label>Category</label>
                    <select name="category"
                            required
                            style="display:block;width:100%;padding:12px;margin:8px 0 20px;">

                        <option value="">Select Category</option>
                        <option value="Vehicle">Vehicle</option>
                        <option value="Equipment">Equipment</option>
                        <option value="Communication">Communication</option>
                        <option value="Medical">Medical</option>
                        <option value="Other">Other</option>

                    </select>

                    <label>Condition</label>
                    <select name="condition_status"
                            required
                            style="display:block;width:100%;padding:12px;margin:8px 0 20px;">

                        <option value="">Select Condition</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Poor">Poor</option>

                    </select>

                    <label>Availability Status</label>
                    <select name="availability_status"
                            required
                            style="display:block;width:100%;padding:12px;margin:8px 0 20px;">

                        <option value="">Select Availability</option>
                        <option value="Ready">Ready</option>
                        <option value="Under Maintenance">Under Maintenance</option>
                        <option value="Unavailable">Unavailable</option>

                    </select>

                </div>

                <button type="submit" class="btn">
                    Save Asset
                </button>

                <button type="reset" class="btn">
                    Reset Form
                </button>

            </form>

        </section>

        <footer class="dashboard-footer">
            DARS | Defense Asset Readiness System
        </footer>

    </main>

</body>
</html>
